apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: shop
type: Opaque
stringData:
  PGPASSWORD: "REPLACE_ME_AT_DEPLOY_TIME"
  POSTGRES_PASSWORD: "REPLACE_ME_AT_DEPLOY_TIME"
