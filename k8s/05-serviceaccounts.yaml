# Per-workload identities (Lab 7a §3.2; Lecture 5 lists "default SA everywhere" as an RBAC pitfall).
#
# Every workload gets its own ServiceAccount with no RoleBinding, so it holds no API permissions at
# all. Token automounting stays disabled. The value is auditability and blast radius: if a workload
# ever needs an API permission it can be granted precisely, and any API action can be attributed to
# one service rather than to a shared default identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-sa
  namespace: shop
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout-sa
  namespace: shop
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pricing-sa
  namespace: shop
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-sa
  namespace: shop
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-sa
  namespace: shop
automountServiceAccountToken: false
