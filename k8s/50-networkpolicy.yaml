# Trust boundaries enforced in BOTH directions.
#
# Ingress rules answer "who may call me". Egress rules answer "who may I call" — without them a
# compromised workload can still reach anything outbound, which is the path taken in the Capital
# One SSRF case (Lecture 6). Lab 12 treats east-west control and egress governance as one topic,
# and its deny-by-default baseline covers both directions.
#
# K3s bundles the kube-router network-policy controller, so these are actually enforced; the
# negative controls in scripts/60-test-networkpolicy.sh prove that rather than assume it.

# ---------- baseline: deny everything, both directions ----------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# ---------- DNS: required by every workload once egress is denied ----------
# Omitting this is the classic mistake: service discovery breaks and the failure presents as an
# application bug rather than a policy bug.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# ---------- PUBLIC tier ----------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-ingress-only
  namespace: shop
spec:
  podSelector:
    matchLabels: { app: gateway }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-egress-to-checkout-only
  namespace: shop
spec:
  podSelector:
    matchLabels: { app: gateway }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: checkout-fn }
      ports:
        - { protocol: TCP, port: 3003 }
---
# ---------- INTERNAL tier ----------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-from-gateway-only
  namespace: shop
spec:
  podSelector:
    matchLabels: { app: checkout-fn }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: gateway }
      ports:
        - { protocol: TCP, port: 3003 }
---
# checkout may reach exactly its two dependencies — not the database, not the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-egress-to-dependencies-only
  namespace: shop
spec:
  podSelector:
    matchLabels: { app: checkout-fn }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: pricing-fn }
      ports:
        - { protocol: TCP, port: 3001 }
    - to:
        - podSelector:
            matchLabels: { app: inventory-fn }
      ports:
        - { protocol: TCP, port: 3002 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pricing-from-checkout-only
  namespace: shop
spec:
  podSelector:
    matchLabels: { app: pricing-fn }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: checkout-fn }
      ports:
        - { protocol: TCP, port: 3001 }
---
# pricing is a pure function: beyond DNS it needs no outbound connectivity at all.
# Stating that explicitly makes the intent auditable instead of incidental.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pricing-egress-none
  namespace: shop
spec:
  podSelector:
    matchLabels: { app: pricing-fn }
  policyTypes: [Egress]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory-from-checkout-only
  namespace: shop
spec:
  podSelector:
    matchLabels: { app: inventory-fn }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: checkout-fn }
      ports:
        - { protocol: TCP, port: 3002 }
---
# inventory owns the data, so it is the only workload permitted to egress to PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory-egress-to-postgres-only
  namespace: shop
spec:
  podSelector:
    matchLabels: { app: inventory-fn }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: postgres }
      ports:
        - { protocol: TCP, port: 5432 }
---
# ---------- PROTECTED tier ----------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-inventory-only
  namespace: shop
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: inventory-fn }
      ports:
        - { protocol: TCP, port: 5432 }
---
# The database must never initiate outbound connections. Exfiltration from the most sensitive
# tier is denied by construction rather than by monitoring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-egress-none
  namespace: shop
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Egress]
  egress: []
