apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: shop
data:
  # Non-secret configuration only. Credentials live in a Secret (see 11-secret.example.yaml).
  PRICING_URL: "http://pricing-svc"
  INVENTORY_URL: "http://inventory-svc"
  TIMEOUT_MS: "1500"
  TAX_RATE: "0.23"
  PGHOST: "postgres-svc"
  PGPORT: "5432"
  PGDATABASE: "shop"
  PGUSER: "shop"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: shop
data:
  # The gateway is the only public surface; it exposes exactly one API route inward.
  default.conf: |
    # Honour an inbound correlation ID when present, otherwise mint one at the edge.
    map $http_x_request_id $correlation_id {
      default $http_x_request_id;
      ""      $request_id;
    }

    server {
      listen 8080;
      server_name _;

      location = /healthz {
        add_header Content-Type application/json;
        return 200 '{"ok":true}';
      }

      location /api/checkout {
        proxy_pass http://checkout-svc/checkout;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
      }

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
    }
  index.html: |
    <!doctype html>
    <html lang="en">
      <head><meta charset="utf-8"><title>Shop checkout</title></head>
      <body>
        <h1>Checkout</h1>
        <button id="go">Place order</button>
        <pre id="out"></pre>
        <script>
          document.getElementById('go').onclick = async () => {
            const started = performance.now();
            const res = await fetch('/api/checkout', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ sku: 1, subtotal: 100 })
            });
            const body = await res.json();
            document.getElementById('out').textContent =
              'HTTP ' + res.status + '  (' + Math.round(performance.now() - started) + ' ms)\n' +
              JSON.stringify(body, null, 2);
          };
        </script>
      </body>
    </html>
