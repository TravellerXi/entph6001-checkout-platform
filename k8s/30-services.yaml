apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-fn
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: { app: pricing-fn, tier: internal }
  template:
    metadata:
      labels: { app: pricing-fn, tier: internal }
    spec:
      serviceAccountName: pricing-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pricing-fn
          image: ead/pricing-fn:v2
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3001 }]
          env:
            - name: PORT
              value: "3001"
            - name: SERVICE_NAME
              value: pricing-fn
            - name: TAX_RATE
              valueFrom: { configMapKeyRef: { name: platform-config, key: TAX_RATE } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /live, port: 3001 }   # shallow on purpose
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 192Mi }
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 5"] }
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-svc
  namespace: shop
spec:
  selector: { app: pricing-fn }
  ports: [{ name: http, port: 80, targetPort: 3001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-fn
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: { app: inventory-fn, tier: internal }
  template:
    metadata:
      labels: { app: inventory-fn, tier: internal }
    spec:
      serviceAccountName: inventory-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: inventory-fn
          image: ead/inventory-fn:v2
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3002 }]
          env:
            - name: PORT
              value: "3002"
            - name: SERVICE_NAME
              value: inventory-fn
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: db-credentials }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /health, port: 3002 }   # deep: this service owns its datastore
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /live, port: 3002 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 192Mi }
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 5"] }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-svc
  namespace: shop
spec:
  selector: { app: inventory-fn }
  ports: [{ name: http, port: 80, targetPort: 3002 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-fn
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: { app: checkout-fn, tier: internal }
  template:
    metadata:
      labels: { app: checkout-fn, tier: internal }
    spec:
      serviceAccountName: checkout-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: checkout-fn
          image: ead/checkout-fn:v2
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3003 }]
          env:
            - name: PORT
              value: "3003"
            - name: SERVICE_NAME
              value: checkout-fn
            - name: PRICING_URL
              valueFrom: { configMapKeyRef: { name: platform-config, key: PRICING_URL } }
            - name: INVENTORY_URL
              valueFrom: { configMapKeyRef: { name: platform-config, key: INVENTORY_URL } }
            - name: TIMEOUT_MS
              valueFrom: { configMapKeyRef: { name: platform-config, key: TIMEOUT_MS } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /health, port: 3003 }   # excludes dependencies by design
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /live, port: 3003 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 192Mi }
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 5"] }
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-svc
  namespace: shop
spec:
  selector: { app: checkout-fn }
  ports: [{ name: http, port: 80, targetPort: 3003 }]
